[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "director-local"
version = "0.1.0"
description = "Windows-first local AI video assistant: metadata and controlled model management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "psutil>=6,<8",
    "packaging>=23,<27",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
downloads = ["huggingface_hub==1.0.0"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["director*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
